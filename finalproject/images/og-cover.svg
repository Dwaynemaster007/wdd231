<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CryptoPulse — Live cryptocurrency market data">
  <defs>
    <!-- Soft glow for the pulse line -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle grid fade -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1f3a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b1f3a" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16c784" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#16c784" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a7a52" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16c784" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#16c784" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0b1f3a"/>

  <!-- Dot grid (market data feel) -->
  <g fill="#16c784" opacity="0.07">
    <circle cx="80" cy="80" r="2"/><circle cx="160" cy="80" r="2"/><circle cx="240" cy="80" r="2"/>
    <circle cx="320" cy="80" r="2"/><circle cx="400" cy="80" r="2"/><circle cx="480" cy="80" r="2"/>
    <circle cx="560" cy="80" r="2"/><circle cx="640" cy="80" r="2"/><circle cx="720" cy="80" r="2"/>
    <circle cx="800" cy="80" r="2"/><circle cx="880" cy="80" r="2"/><circle cx="960" cy="80" r="2"/>
    <circle cx="1040" cy="80" r="2"/><circle cx="1120" cy="80" r="2"/>
    <circle cx="80" cy="160" r="2"/><circle cx="160" cy="160" r="2"/><circle cx="240" cy="160" r="2"/>
    <circle cx="320" cy="160" r="2"/><circle cx="400" cy="160" r="2"/><circle cx="480" cy="160" r="2"/>
    <circle cx="560" cy="160" r="2"/><circle cx="640" cy="160" r="2"/><circle cx="720" cy="160" r="2"/>
    <circle cx="800" cy="160" r="2"/><circle cx="880" cy="160" r="2"/><circle cx="960" cy="160" r="2"/>
    <circle cx="1040" cy="160" r="2"/><circle cx="1120" cy="160" r="2"/>
    <circle cx="80" cy="240" r="2"/><circle cx="160" cy="240" r="2"/><circle cx="240" cy="240" r="2"/>
    <circle cx="320" cy="240" r="2"/><circle cx="400" cy="240" r="2"/><circle cx="480" cy="240" r="2"/>
    <circle cx="560" cy="240" r="2"/><circle cx="640" cy="240" r="2"/><circle cx="720" cy="240" r="2"/>
    <circle cx="800" cy="240" r="2"/><circle cx="880" cy="240" r="2"/><circle cx="960" cy="240" r="2"/>
    <circle cx="1040" cy="240" r="2"/><circle cx="1120" cy="240" r="2"/>
    <circle cx="80" cy="520" r="2"/><circle cx="160" cy="520" r="2"/><circle cx="240" cy="520" r="2"/>
    <circle cx="320" cy="520" r="2"/><circle cx="400" cy="520" r="2"/><circle cx="480" cy="520" r="2"/>
    <circle cx="560" cy="520" r="2"/><circle cx="640" cy="520" r="2"/><circle cx="720" cy="520" r="2"/>
    <circle cx="800" cy="520" r="2"/><circle cx="880" cy="520" r="2"/><circle cx="960" cy="520" r="2"/>
    <circle cx="1040" cy="520" r="2"/><circle cx="1120" cy="520" r="2"/>
  </g>

  <!-- Decorative corner arcs -->
  <path d="M0 0 H180 A180 180 0 0 1 0 180 Z" fill="#16c784" opacity="0.06"/>
  <path d="M1200 630 H1020 A180 180 0 0 1 1200 450 Z" fill="#16c784" opacity="0.06"/>

  <!-- Pulse / sparkline chart (left-center) -->
  <g transform="translate(80, 200)">
    <!-- Area under curve -->
    <path d="M0 180 L40 160 L90 170 L140 110 L190 130 L250 60 L310 90 L370 40 L430 70 L490 20 L550 50 L600 10 L600 200 L0 200 Z"
          fill="url(#areaGrad)"/>
    <!-- Main pulse line -->
    <path d="M0 180 L40 160 L90 170 L140 110 L190 130 L250 60 L310 90 L370 40 L430 70 L490 20 L550 50 L600 10"
          fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- Endpoint pulse dot -->
    <circle cx="600" cy="10" r="8" fill="#16c784"/>
    <circle cx="600" cy="10" r="14" fill="#16c784" opacity="0.25"/>
  </g>

  <!-- Right-side brand stack -->
  <g transform="translate(720, 200)">
    <!-- CP mark -->
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#16c784"/>
    <text x="32" y="42" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#0b1f3a">CP</text>

    <!-- Wordmark -->
    <text x="0" y="120" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="700" fill="#16c784">CryptoPulse</text>

    <!-- Tagline -->
    <text x="0" y="168" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#c8d0dc">Live cryptocurrency market data</text>

    <!-- Accent underline -->
    <rect x="0" y="188" width="120" height="4" rx="2" fill="#16c784"/>

    <!-- Mini metric chips -->
    <g transform="translate(0, 220)" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
      <rect x="0" y="0" width="110" height="36" rx="8" fill="#ffffff12"/>
      <text x="16" y="24" font-size="14" fill="#c8d0dc">Price</text>
      <text x="60" y="24" font-size="14" font-weight="600" fill="#16c784">Live</text>

      <rect x="122" y="0" width="110" height="36" rx="8" fill="#ffffff12"/>
      <text x="138" y="24" font-size="14" fill="#c8d0dc">24h</text>
      <text x="172" y="24" font-size="14" font-weight="600" fill="#16c784">Change</text>

      <rect x="244" y="0" width="130" height="36" rx="8" fill="#ffffff12"/>
      <text x="260" y="24" font-size="14" fill="#c8d0dc">Market</text>
      <text x="316" y="24" font-size="14" font-weight="600" fill="#16c784">Cap</text>
    </g>
  </g>
</svg>
